<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OJOb — 로그인</title>
<style>
:root{--p:#7A3BFF;--p2:#5820CC;--lilac:#D8B4FC;--misty:#F4ECFF;--charcoal:#1E1B2E;--cloud:#F7F7FA;--txt:#1E1B2E;--txt-sub:#3A3060;--muted:#8878B8;--border:rgba(122,59,255,0.12);--g:#22C58B;--error:#FF5C8A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--cloud);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:#fff;border-bottom:1px solid var(--border);}
.nav-logo img{height:28px;object-fit:contain;}
.nav-logo span{font-size:1.3rem;font-weight:900;color:var(--p);}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(122,59,255,.1);width:100%;max-width:420px;padding:40px 36px;}
.card-logo{text-align:center;margin-bottom:28px;}
.card-logo img{height:44px;object-fit:contain;}
.card-logo span{font-size:2rem;font-weight:900;color:var(--p);}
.card-title{font-size:1.4rem;font-weight:900;text-align:center;margin-bottom:6px;}
.card-sub{font-size:.9rem;color:var(--muted);text-align:center;margin-bottom:32px;}

/* Type toggle */
.type-toggle{display:flex;background:var(--misty);border-radius:12px;padding:4px;gap:4px;margin-bottom:28px;}
.type-btn{flex:1;padding:10px;border-radius:9px;border:none;background:transparent;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;}
.type-btn.on{background:#fff;color:var(--p);box-shadow:0 2px 8px rgba(122,59,255,.12);}

.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:.82rem;font-weight:700;color:var(--txt-sub);margin-bottom:6px;}
.form-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:.95rem;color:var(--txt);background:#fff;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
.form-input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(122,59,255,.08);}
.form-input::placeholder{color:var(--muted);}
.form-input-group{display:flex;gap:8px;}
.form-input-group .form-input{flex:1;}
.send-btn{padding:13px 16px;background:var(--misty);border:1.5px solid var(--lilac);border-radius:12px;font-size:.82rem;font-weight:700;color:var(--p);cursor:pointer;white-space:nowrap;transition:all .2s;}
.send-btn:hover{background:var(--p);color:#fff;border-color:var(--p);}

.auth-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.auth-opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;}
.auth-opt:hover{border-color:var(--p);background:var(--misty);}
.auth-opt.on{border-color:var(--p);background:var(--misty);}
.ao-icon{font-size:1.3rem;width:32px;text-align:center;}
.ao-title{font-size:.88rem;font-weight:700;}
.ao-sub{font-size:.72rem;color:var(--muted);}
.ao-check{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:all .2s;}
.auth-opt.on .ao-check{background:var(--p);border-color:var(--p);color:#fff;}

.btn-main{width:100%;padding:15px;background:var(--p);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(122,59,255,.3);transition:transform .2s,box-shadow .2s;margin-top:8px;}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(122,59,255,.4);}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:.8rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

.social-btns{display:flex;flex-direction:column;gap:10px;}
.social-btn{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;color:var(--txt);}
.social-btn:hover{border-color:var(--p);background:var(--misty);}
.social-btn .sb-icon{font-size:1.2rem;}

.bottom-links{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:24px;font-size:.82rem;}
.bottom-links a{color:var(--muted);text-decoration:none;transition:color .2s;}
.bottom-links a:hover{color:var(--p);}
.bottom-links .sep{color:var(--border);}

.code-group{margin-top:12px;display:none;}
.form-hint{font-size:.75rem;color:var(--muted);margin-top:5px;}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <img src="OJOb_logo.png" alt="OJOb" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
    <span style="display:none">OJOb</span>
  </a>
  <a href="index.html" style="font-size:.875rem;color:var(--muted);text-decoration:none;">← 메인으로</a>
</nav>

<main>
  <div class="card">
    <div class="card-logo">
      <img src="OJOb_logo.png" alt="OJOb" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
      <span style="display:none">OJOb</span>
    </div>
    <div class="card-title">다시 만나요 👋</div>
    <div class="card-sub">로그인하고 오늘의 일자리를 찾아보세요</div>

    <div class="type-toggle">
      <button class="type-btn on" onclick="setType(this,'worker')">👤 구직자</button>
      <button class="type-btn" onclick="setType(this,'employer')">🏢 사업주</button>
    </div>

    <div class="auth-opts">
      <div class="auth-opt on" onclick="selectAuth(this)">
        <div class="ao-icon">🔐</div>
        <div><div class="ao-title">PASS 앱 인증</div><div class="ao-sub">가장 빠른 로그인</div></div>
        <div class="ao-check">✓</div>
      </div>
      <div class="auth-opt" onclick="selectAuth(this)">
        <div class="ao-icon">💬</div>
        <div><div class="ao-title">SMS 인증번호</div><div class="ao-sub">문자로 로그인</div></div>
        <div class="ao-check"></div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">휴대폰 번호</label>
      <div class="form-input-group">
        <input type="tel" class="form-input" placeholder="010-0000-0000" oninput="formatPhone(this)"/>
        <button class="send-btn" onclick="sendCode()">인증번호</button>
      </div>
    </div>
    <div class="code-group" id="code-group">
      <div class="form-input-group">
        <input type="text" class="form-input" placeholder="인증번호 6자리" maxlength="6"/>
        <button class="send-btn" onclick="doLogin()">확인</button>
      </div>
      <div class="form-hint" id="timer-label">남은 시간: 3:00</div>
    </div>

    <button class="btn-main" onclick="doLogin()">로그인</button>

    <div class="divider">또는 소셜 로그인</div>
    <div class="social-btns">
      <button class="social-btn"><span class="sb-icon">💛</span> 카카오로 계속하기</button>
      <button class="social-btn"><span class="sb-icon">🟢</span> 네이버로 계속하기</button>
    </div>

    <div class="bottom-links">
      <a href="signup.html">회원가입</a>
      <span class="sep">|</span>
      <a href="#">아이디 찾기</a>
      <span class="sep">|</span>
      <a href="#">비밀번호 찾기</a>
    </div>
  </div>
</main>

<script>
function setType(el, type) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}
function selectAuth(el) {
  document.querySelectorAll('.auth-opt').forEach(a => {
    a.classList.remove('on');
    a.querySelector('.ao-check').textContent = '';
  });
  el.classList.add('on');
  el.querySelector('.ao-check').textContent = '✓';
}
function formatPhone(input) {
  let v = input.value.replace(/\D/g,'');
  if (v.length > 3 && v.length <= 7) v = v.slice(0,3)+'-'+v.slice(3);
  else if (v.length > 7) v = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  input.value = v;
}
let countdown = 180;
let timer;
function sendCode() {
  document.getElementById('code-group').style.display = 'block';
  clearInterval(timer);
  countdown = 180;
  timer = setInterval(() => {
    countdown--;
    const m = Math.floor(countdown/60);
    const s = countdown % 60;
    document.getElementById('timer-label').textContent = `남은 시간: ${m}:${s.toString().padStart(2,'0')}`;
    if (countdown <= 0) clearInterval(timer);
  }, 1000);
}
function doLogin() {
  // MVP: 바로 메인으로
  window.location.href = 'index.html';
}
</script>
</body>
</html>
